<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PWA Studio Pro | App Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@jaames/iro@5"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-[#0b0f19] text-white min-h-screen font-sans selection:bg-blue-500 selection:text-white relative overflow-x-hidden flex flex-col">
    
    <div class="absolute top-0 left-1/2 -translate-x-1/2 w-[800px] h-[500px] bg-blue-600/10 blur-[150px] rounded-full pointer-events-none z-0"></div>

    <header class="w-full flex flex-col items-center pt-8 pb-6 z-10 animate-fade-in-down">
        <div class="w-16 h-16 bg-gradient-to-br from-blue-500 to-indigo-600 rounded-2xl flex items-center justify-center mb-3 shadow-[0_0_30px_rgba(59,130,246,0.3)]">
            <i class="fa-solid fa-bolt-lightning text-white text-2xl"></i>
        </div>
        <h1 class="text-3xl font-extrabold tracking-wide">PWA Studio Pro</h1>
        <p class="text-gray-400 text-sm mt-1">Universal Web App Generator</p>
    </header>

    <main class="w-11/12 max-w-6xl mx-auto z-10 flex flex-col lg:flex-row gap-10 lg:gap-16 flex-grow mb-10 items-center lg:items-start justify-center">
        
        <div class="w-full lg:w-5/12 flex flex-col items-center justify-center order-1 lg:order-2 animate-fade-in pt-2">
            <h3 class="text-gray-400 text-xs font-bold uppercase tracking-[0.2em] mb-4 flex items-center gap-2">
                <i class="fa-solid fa-mobile-screen"></i> Live App Preview
            </h3>
            
            <div class="w-[300px] h-[600px] border-[12px] border-gray-900 rounded-[3rem] relative bg-white shadow-[0_20px_50px_rgba(0,0,0,0.6)] flex flex-col overflow-hidden mx-auto">
                <div class="absolute top-0 left-1/2 -translate-x-1/2 w-32 h-6 bg-gray-900 rounded-b-2xl z-30"></div>
                
                <div id="preview-header" class="w-full h-16 pt-5 px-5 flex items-center justify-center gap-3 z-20 relative transition-colors duration-300 shadow-sm" style="background-color: #3B82F6;">
                    <img id="preview-icon" src="https://via.placeholder.com/150?text=Icon" alt="Icon" class="w-8 h-8 rounded-lg object-cover shadow-sm bg-white">
                    <span id="preview-name" class="text-white font-bold text-sm truncate">Riduan Codex</span>
                </div>

                <div class="w-full flex-1 relative bg-[#0b0f19] overflow-hidden rounded-b-[2.5rem]">
                    <iframe id="preview-iframe" class="border-none absolute top-0 left-0 bg-white origin-top-left" style="width: 220%; height: 220%; transform: scale(0.4545);" src="about:blank"></iframe>
                    <div id="preview-placeholder" class="absolute inset-0 flex flex-col items-center justify-center text-gray-400 text-xs text-center px-4 bg-[#f8fafc]">
                        <i class="fa-solid fa-globe text-4xl mb-3 opacity-30"></i>
                        <span class="font-medium text-gray-500">Enter a URL to see live preview</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="w-full lg:w-6/12 flex flex-col order-2 lg:order-1">
            <div class="animated-border-box bg-[#141b2d]/90 backdrop-blur-xl p-6 lg:p-8 rounded-3xl border border-gray-800 shadow-2xl animate-fade-in-up w-full">
                <h2 class="text-xl font-bold mb-6 flex items-center gap-2">
                    <i class="fa-solid fa-sliders text-blue-500"></i> App Configuration
                </h2>
                
                <form id="pwa-form" class="space-y-5">
                    <div>
                        <label class="block text-sm font-semibold text-gray-300 mb-2">App Name</label>
                        <input type="text" id="appName" required placeholder="e.g. Riduan Codex" class="w-full bg-[#0b0f19] text-white px-5 py-3.5 rounded-xl border border-gray-700 focus:border-blue-500 outline-none transition duration-300 placeholder-gray-600">
                    </div>

                    <div>
                        <label class="block text-sm font-semibold text-gray-300 mb-2">Target Website URL</label>
                        <input type="url" id="appUrl" required placeholder="https://example.com" class="w-full bg-[#0b0f19] text-white px-5 py-3.5 rounded-xl border border-gray-700 focus:border-blue-500 outline-none transition duration-300 placeholder-gray-600">
                    </div>

                    <div>
                        <label class="block text-sm font-semibold text-gray-300 mb-2">App Icon URL</label>
                        <input type="url" id="appIcon" required placeholder="https://example.com/icon.png" class="w-full bg-[#0b0f19] text-white px-5 py-3.5 rounded-xl border border-gray-700 focus:border-blue-500 outline-none transition duration-300 placeholder-gray-600">
                    </div>

                    <div>
                        <label class="block text-sm font-semibold text-gray-300 mb-3">Theme Color</label>
                        <div class="flex items-center gap-3">
                            <div id="colorPreview" class="w-12 h-12 rounded-full shadow-[0_0_15px_rgba(0,0,0,0.5)] border-2 border-white/20 cursor-pointer hover:scale-105 transition-transform" style="background-color: #3B82F6;" onclick="toggleColorWheel()"></div>
                            <div class="flex items-center bg-[#0b0f19] border border-gray-700 rounded-xl overflow-hidden focus-within:border-blue-500 transition-colors flex-1 max-w-[200px]">
                                <span class="pl-4 pr-2 text-gray-500 font-bold">HEX</span>
                                <input type="text" id="themeHex" value="#3B82F6" class="bg-transparent text-white py-3 pr-4 outline-none font-mono font-semibold uppercase w-full">
                            </div>
                        </div>
                        <input type="hidden" id="appTheme" value="#3B82F6">
                    </div>

                    <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-4 px-4 rounded-xl transition-all duration-300 mt-4 shadow-[0_0_20px_rgba(59,130,246,0.3)] transform hover:-translate-y-1 flex justify-center items-center gap-2">
                        Generate & Install App <i class="fa-solid fa-arrow-right"></i>
                    </button>
                </form>
            </div>
        </div>
    </main>

    <div id="colorWheelOverlay" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-[100] hidden flex-col items-center justify-center opacity-0 transition-opacity duration-300">
        <div id="colorWheelModal" class="bg-[#1a2235] p-6 rounded-3xl border border-gray-700 shadow-2xl transform scale-95 transition-transform duration-300 w-[90%] max-w-sm relative">
            <div class="flex justify-between items-center mb-5 border-b border-gray-800 pb-4">
                <span class="text-sm text-gray-300 font-bold uppercase tracking-widest flex items-center gap-2"><i class="fa-solid fa-palette text-blue-500"></i> Select Color</span>
                <button type="button" onclick="toggleColorWheel()" class="text-gray-400 hover:text-white bg-gray-800 hover:bg-red-500/20 hover:text-red-400 transition-colors w-8 h-8 rounded-full flex items-center justify-center">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div id="colorWheel" class="flex justify-center mb-2"></div>
        </div>
    </div>

    <section class="developer-connect z-10 w-full mt-auto pb-6">
        <p class="dev-tag">Developed by <span>Riduanul Islam</span></p>
        <div class="social-dock">
            <a href="https://m.youtube.com/@riduan0?sub_confirmation=1" target="_blank" class="social-pill yt"><i class="fa-brands fa-youtube"></i></a>
            <a href="https://www.facebook.com/share/1KfA6dirNN/" target="_blank" class="social-pill fb"><i class="fa-brands fa-facebook-f"></i></a>
            <a href="https://www.instagram.com/riduanulislam03?igsh=eWZ6cWo0bWc0bjdy" target="_blank" class="social-pill ig"><i class="fa-brands fa-instagram"></i></a>
            <a href="https://www.tiktok.com/@riduanulislam03?" target="_blank" class="social-pill tt"><i class="fa-brands fa-tiktok"></i></a>
            <a href="https://t.me/RiduanOfficialBD" target="_blank" class="social-pill tg"><i class="fa-brands fa-telegram"></i></a>
        </div>
    </section>

    <script src="script.js"></script>
</body>
</html>
